---
- name: Bootstrap packages and Python with raw (works before Python exists)
  ansible.builtin.raw: |
    set -eu
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y {{ bootstrap_packages | map('quote') | join(' ') }}
    systemctl enable --now ssh || systemctl enable --now sshd
    install -d -m 0755 /var/lib/jenkins-buildfarm
  register: bootstrap_raw
  changed_when: "' 0 newly installed' not in (bootstrap_raw.stdout | default(''))"
  tags: [bootstrap]

- name: Gather facts after Python installation
  ansible.builtin.setup:
  tags: [bootstrap]
